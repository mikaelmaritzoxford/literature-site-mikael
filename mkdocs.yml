site_name: "Zirconium-Doped Indium Oxide (IZrO)"
site_description: "Literature knowledge base for zirconium-doped indium oxide"
site_author: "OpenAI scaffold"
docs_dir: docs
site_dir: site

theme:
  name: material

nav:
  - Home: index.md
  - Papers: papers.md
  - Reported Data: reported-data.md

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true

extra_css:
